[project]
name = "playground"
version = "0.2.0"
description = "PDF question-answering RAG application using LangChain, Ollama, and Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-qdrant>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "pypdf>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.12.0",
    "python-dotenv>=1.0.0",
    "ipykernel>=6.29.0",
]

[tool.uv]
package = false
